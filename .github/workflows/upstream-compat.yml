name: upstream compat

# Mobilewright is 0.0.x with no semver guarantee, and our driver is client-side:
# a customer running `npm update` gets a new upstream before we deploy anything.
# This job is the early warning — it builds against the LATEST upstream every
# day, so we find out before customers do.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:

jobs:
  pinned:
    name: pinned protocol (what we support today)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  latest:
    name: latest protocol (early warning)
    runs-on: ubuntu-latest
    # Upstream breaking is news, not a reason to block our own PRs.
    continue-on-error: true
    outputs:
      failed: ${{ steps.check.outcome == 'failure' }}
      version: ${{ steps.versions.outputs.protocol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm ci
      - id: versions
        run: |
          echo "protocol=$(npm view @mobilewright/protocol version)" >> "$GITHUB_OUTPUT"
          echo "pinned=$(node -p "require('./package.json').devDependencies['@mobilewright/protocol']")" >> "$GITHUB_OUTPUT"
      - name: install latest upstream
        run: npm i -D @mobilewright/protocol@latest
      - id: check
        name: typecheck and unit tests against latest
        run: |
          npm run typecheck
          npm run build
          npm test

  report:
    name: open an issue when latest breaks
    needs: latest
    if: needs.latest.outputs.failed == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.latest.outputs.version }}';
            const title = `Upstream @mobilewright/protocol ${version} breaks the driver`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'upstream',
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo,
              title,
              labels: ['upstream'],
              body: [
                `The nightly build against \`@mobilewright/protocol@${version}\` failed.`,
                '',
                'Checklist:',
                '1. Read the upstream CHANGELOG for driver-facing entries.',
                '2. If the interface moved, adapt and widen the peer range.',
                '3. If only behaviour moved, run the conformance suite on a real device —',
                '   `tsc` will not catch a semantic change (see 0.0.56, which started',
                '   passing `clip` to `screenshot()` with no interface change).',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
